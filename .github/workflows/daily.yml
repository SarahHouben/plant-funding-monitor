# The daily run: fetch, screen, extract and update into data/funding.db, then
# commit the database if it changed. The pipeline summary goes to the job
# summary. A failing source or candidate is normal; a stopped or crashed
# pipeline fails the job, so GitHub sends a notification, and nothing is
# committed (a stopped run can leave unscreened page texts in the database).

name: Daily pipeline

on:
  schedule:
    - cron: "23 4 * * *"   # 04:23 UTC, a quiet time not on the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Apply edits to sources.csv and tags.csv
        run: python init_db.py --db data/funding.db

      - name: Run the pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python -u pipeline.py --db data/funding.db --max-cost 0.30 | tee pipeline-summary.txt

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## Daily run $(date -u +%Y-%m-%d)"
            echo
            if [ -s pipeline-summary.txt ]; then
              echo '```'
              cat pipeline-summary.txt
              echo '```'
            else
              echo "The pipeline printed no summary; see the log of the step that failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data/funding.db
        run: |
          if git diff --quiet -- data/funding.db; then
            echo "data/funding.db is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "Daily run $(date -u +%Y-%m-%d)"; echo; cat pipeline-summary.txt; } > commit-message.txt
          git add data/funding.db
          git commit --quiet --file commit-message.txt
          git pull --rebase --quiet origin "$GITHUB_REF_NAME"
          git push --quiet origin "HEAD:$GITHUB_REF_NAME"
